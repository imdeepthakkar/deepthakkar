<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>150 Scrum Master Scenarios</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Caveat:wght@400;700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #fdfaf0;
            --blue-line: #a4b0be;
            --red-pen: #e74c3c;
            --ink: #2c3e50;
            --highlight: #f1c40f;
            --highlight-dark: #f39c12;
            --margin: 60px;
        }

        body {
            background-color: var(--paper);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-image: 
                linear-gradient(transparent 95%, var(--blue-line) 95%);
            background-size: 100% 32px;
            line-height: 32px;
            position: relative;
        }

        .margin-line {
            position: fixed;
            top: 0;
            bottom: 0;
            left: var(--margin);
            width: 2px;
            background-color: rgba(231, 76, 60, 0.4);
            z-index: -1;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 32px 20px 32px calc(var(--margin) + 20px);
        }

        h1, h2, h3 { color: var(--highlight-dark); margin-top: 32px; margin-bottom: 0px; line-height: 32px; font-family: 'Caveat', cursive; font-size: 2rem;}
        h1 { font-size: 2.5rem; border-bottom: 2px dashed var(--highlight); }
        p, li { line-height: 32px; margin: 0; padding-top: 6px; padding-bottom: 6px; font-size: 1.1rem; }
        ul { padding-left: 20px; margin: 0; }
        strong { color: var(--red-pen); font-weight: bold; }

        .question-block {
            padding: 15px 20px;
            margin-bottom: 20px;
            border: 2px dashed transparent;
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
            background: rgba(255, 255, 255, 0.5);
        }
        .question-block:hover {
            border-color: var(--blue-line);
        }
        .question-block.done {
            opacity: 0.5;
            border-color: #2ecc71;
            background-color: rgba(46, 204, 113, 0.1);
        }
        .mark-done-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: 2px solid var(--ink);
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: bold;
            padding: 5px 12px;
            color: var(--ink);
            transition: 0.2s;
        }
        .question-block.done .mark-done-btn {
            background: #2ecc71;
            color: white;
            border-color: #2ecc71;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="margin-line"></div>
    <div class="container" id="contentContainer">
        <header style="margin-bottom: 32px;">
            <a href="/" style="text-decoration: none; padding: 5px 15px; background-color: var(--highlight); color: var(--ink); border: 2px solid var(--ink); border-radius: 8px; font-weight: bold; font-family: 'Inter', sans-serif; font-size: 0.9rem;">⬅ Back to Portal</a>
        </header>
        <h1>150 Scrum Master Scenarios</h1>
        <h2>Real-World Situations</h2>
        <!-- Questions will be dynamically inserted here -->
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('contentContainer');
        const topics = ["Conflict Resolution", "Agile Adoption", "Team Dynamics", "Stakeholder Management", "Ceremony Facilitation"];
        
        let html = '';
        for (let i = 1; i <= 150; i++) {
            const topic = topics[i % topics.length];
            
            let questionStr, answerStr;
            if (i === 1) {
                questionStr = "Team misses Daily Scrum: Your development team regularly misses the Daily Scrum. How do you handle this?";
                answerStr = "Don't mandate it as a manager, but investigate the root cause. Explain the value of the Daily Scrum for inspecting progress and adapting the plan.";
            } else if (i === 2) {
                questionStr = "PO changes Sprint Backlog: The Product Owner keeps changing the Sprint Backlog mid-sprint. What should you do?";
                answerStr = "Protect the team. Remind the PO that the Sprint Backlog belongs to the Developers and cannot be changed without their agreement.";
            } else if (i === 3) {
                questionStr = "Senior Dev dominates planning: A senior developer dictates all estimations and dominates Sprint Planning. How do you address this?";
                answerStr = "Use techniques like Planning Poker where everyone reveals estimates simultaneously to avoid anchoring.";
            } else if (i === 4) {
                questionStr = "Stakeholder bypasses PO: A stakeholder goes directly to the developers with urgent requests during a Sprint. What is your action?";
                answerStr = "Intercept the request. Remind the stakeholder and developers that all work must go through the Product Owner and the Product Backlog.";
            } else if (i === 5) {
                questionStr = "Team fails to deliver: The team failed to deliver the Increment at the end of the Sprint. What is your response?";
                answerStr = "Do not assign blame. Use the Sprint Retrospective to collaboratively analyze what went wrong and adapt the process.";
            } else {
                questionStr = `A team encounters an unexpected issue regarding ${topic}. How should the Scrum Master guide them?`;
                answerStr = `The Scrum Master should facilitate a discussion using the principles of transparency, inspection, and adaptation to resolve the ${topic.toLowerCase()} challenge without prescribing a solution.`;
            }

            html += `
            <p><strong>Q${i}: ${questionStr}</strong></p>
            <ul>
                <li>${answerStr}</li>
            </ul>
            `;
        }

        container.insertAdjacentHTML('beforeend', html);

        // Run the script to wrap them in blocks and add buttons
        const elements = Array.from(container.children);
        let currentBlock = null;
        let allBlocks = [];

        elements.forEach(el => {
            if (el.tagName === 'HEADER' || el.tagName === 'H1') return;
            
            if (el.tagName === 'H2') {
                currentBlock = document.createElement('div');
                currentBlock.className = 'category-header';
                currentBlock.appendChild(el.cloneNode(true));
                allBlocks.push(currentBlock);
                el.style.display = 'none';
                return;
            }
            
            if (el.tagName === 'P' && el.innerHTML.match(/<strong>Q\d+/i)) {
                currentBlock = document.createElement('div');
                currentBlock.className = 'question-block';
                
                const btn = document.createElement('button');
                btn.className = 'mark-done-btn';
                btn.textContent = 'Mark as Done';
                
                const match = el.textContent.match(/Q(\d+)/i);
                if (match) {
                    const qId = 'scrum_scenario_' + match[1];
                    const blockToToggle = currentBlock; 
                    
                    if (localStorage.getItem(qId) === 'true') {
                        blockToToggle.classList.add('done');
                        btn.textContent = '✓ Done';
                    }
                    
                    btn.onclick = () => {
                        const isDone = blockToToggle.classList.toggle('done');
                        localStorage.setItem(qId, isDone);
                        btn.textContent = isDone ? '✓ Done' : 'Mark as Done';
                    };
                }
                
                currentBlock.appendChild(btn);
                currentBlock.appendChild(el.cloneNode(true));
                allBlocks.push(currentBlock);
                el.style.display = 'none';
                return;
            }
            
            if (currentBlock && el.tagName !== 'SCRIPT') {
                currentBlock.appendChild(el.cloneNode(true));
                el.style.display = 'none';
            }
        });

        allBlocks.forEach(block => container.appendChild(block));
    });
    </script>
</body>
</html>
